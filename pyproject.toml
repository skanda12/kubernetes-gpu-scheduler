[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuorch"
version = "0.1.0"
description = "Priority-aware GPU orchestrator for Kubernetes (RVCE Cloud Computing PBL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=29.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus_client>=0.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.535"]
analysis = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "pre-commit>=3.6", "matplotlib>=3.8"]

[project.scripts]
gpuorch = "gpuorch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "gpu: needs a real NVIDIA GPU + NVML (skipped by default; run with -m gpu)",
    "integration: needs a running kind cluster with gpuorch deployed (run with -m integration)",
]
addopts = "-m 'not gpu and not integration'"

[tool.coverage.run]
source = ["gpuorch"]
omit = ["*/main.py", "*/__main__.py"]
