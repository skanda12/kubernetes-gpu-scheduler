apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: check
          image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-runtime
          command: ["bash", "-c"]
          args:
            - |
              nvidia-smi && python -c "import torch; print('cuda', torch.cuda.is_available(), torch.cuda.get_device_name(0)); x=torch.randn(4096,4096,device='cuda'); print('matmul ok', (x@x).sum().item())"
          resources:
            limits: {nvidia.com/gpu: 1}
